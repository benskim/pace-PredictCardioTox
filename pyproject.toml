[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictcardiotox-qtc-research"
version = "0.2.0"
description = "Codespaces-ready research workspace for QTc measurement validation, T-wave delineation, and clinical trial safety analytics."
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.18",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "neurokit2>=0.2",
    "streamlit>=1.35",
    "tabulate>=0.9",
    "torch>=2.2",
    "wfdb>=4.1",
    # Pinned transitive dependency minimums to address known CVEs
    "aiohttp>=3.14.0",
    "pillow>=12.2.0",
    "idna>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
lightning = [
    "pytorch-lightning>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
